<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-title>{{ (activeProfile$ | async)?.displayName }}'s Calendar</ion-title>
    <ion-buttons slot="end">
      <ion-button routerLink="/dashboard">Dashboard</ion-button>
    </ion-buttons>
  </ion-toolbar>
  <ion-toolbar>
    <app-profile-switcher></app-profile-switcher>
  </ion-toolbar>
</ion-header>

<ion-content>
  <div class="calendar-toolbar">
    <div class="nav-buttons">
      <ion-button fill="outline" size="small" mwlCalendarPreviousView [view]="view" [(viewDate)]="viewDate">‹</ion-button>
      <ion-button fill="outline" size="small" mwlCalendarToday [(viewDate)]="viewDate">Today</ion-button>
      <ion-button fill="outline" size="small" mwlCalendarNextView [view]="view" [(viewDate)]="viewDate">›</ion-button>
    </div>
    <h2>{{ viewDate | calendarDate: view + 'ViewTitle' : 'en' }}</h2>
    <div class="view-buttons">
      <ion-button size="small" [fill]="view === CalendarView.Month ? 'solid' : 'outline'" (click)="setView(CalendarView.Month)">Month</ion-button>
      <ion-button size="small" [fill]="view === CalendarView.Week ? 'solid' : 'outline'" (click)="setView(CalendarView.Week)">Week</ion-button>
      <ion-button size="small" [fill]="view === CalendarView.Day ? 'solid' : 'outline'" (click)="setView(CalendarView.Day)">Day</ion-button>
    </div>
  </div>

  @switch (view) {
    @case (CalendarView.Month) {
      <mwl-calendar-month-view [viewDate]="viewDate" [events]="events()" (eventClicked)="onEventClicked($event.event)" />
    }
    @case (CalendarView.Week) {
      <mwl-calendar-week-view [viewDate]="viewDate" [events]="events()" (eventClicked)="onEventClicked($event.event)" />
    }
    @case (CalendarView.Day) {
      <mwl-calendar-day-view [viewDate]="viewDate" [events]="events()" (eventClicked)="onEventClicked($event.event)" />
    }
  }

  <ion-fab vertical="bottom" horizontal="end" slot="fixed">
    <ion-fab-button (click)="createEvent()">
      <ion-icon name="add"></ion-icon>
    </ion-fab-button>
  </ion-fab>
</ion-content>
