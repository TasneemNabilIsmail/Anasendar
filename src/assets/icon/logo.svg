<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="badgeGrad" x1="2" y1="2" x2="62" y2="62" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6C5CE7"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <clipPath id="cardClip">
      <rect x="9" y="15" width="46" height="41" rx="8"/>
    </clipPath>
  </defs>

  <!-- badge -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#badgeGrad)"/>

  <!-- calendar hanging rings -->
  <rect x="19" y="0" width="4" height="10" rx="2" fill="#ffffff" opacity="0.9"/>
  <rect x="41" y="0" width="4" height="10" rx="2" fill="#ffffff" opacity="0.9"/>

  <!-- calendar card -->
  <g clip-path="url(#cardClip)">
    <rect x="9" y="15" width="46" height="41" fill="#ffffff"/>
    <rect x="9" y="15" width="46" height="11" fill="#EDE9FE"/>
    <circle cx="18" cy="20.5" r="1.6" fill="#6C5CE7"/>
    <circle cx="25.5" cy="20.5" r="1.6" fill="#6C5CE7"/>
    <circle cx="33" cy="20.5" r="1.6" fill="#6C5CE7"/>

    <!-- human -->
    <circle cx="23" cy="34.5" r="5" fill="#FF7A59"/>
    <path d="M13.5 56c0-6.9 5-11 9.5-11s9.5 4.1 9.5 11" fill="#FF7A59"/>

    <!-- robot -->
    <circle cx="41" cy="24" r="2" fill="#22D3EE"/>
    <rect x="39.5" y="25" width="3" height="5" rx="1.5" fill="#22D3EE"/>
    <rect x="33" y="30" width="14" height="11" rx="3.5" fill="#22D3EE"/>
    <circle cx="37" cy="35" r="1.5" fill="#0B3B45"/>
    <circle cx="43" cy="35" r="1.5" fill="#0B3B45"/>
    <path d="M31 56c0-6.4 4.6-10.2 9.5-10.2S50 49.6 50 56" fill="#22D3EE"/>
  </g>
</svg>
